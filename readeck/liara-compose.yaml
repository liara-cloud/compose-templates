apps:
  - id: "Readeck"
    name: "readeck"
    image: "registry.c2.liara.ir/one-click-apps/readeck:0.22.3"
    bundlePlanID: "standard"
    planID: "small-g2"
    disks:
      - name: data
        mountTo: /readeck
        size: 50
        maxSize: 5

    port: 8000

    envs:
      READECK_LOG_LEVEL: "info"
      READECK_SERVER_HOST: "0.0.0.0"
      READECK_SERVER_PORT: "8000"
      READECK_LOG_FORMAT: "text"
      
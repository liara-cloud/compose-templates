apps:
  - id: openmuse
    name: openmuse
    image: registry.c2.liara.ir/one-click-apps/openmuse:1-liara
    bundlePlanID: standard
    planID: standard-base-g2
    port: 8787

    disks:
      - name: data
        mountTo: /data
        size: 50
        maxSize: 5

    envs:
      
      PUBLIC_API_URL: "https://$APP_NAME.liara.run"
      OPENMUSE_ACCESS_KEY: ""
      DATABASE_URL: "postgres://$DB_main_USER:$DB_main_PASSWORD@$DB_main_HOST:$DB_main_PORT/postgres"

      MODEL: "openai/gpt-6-luna"
      OPENAI_API_KEY: ""
      OPENAI_BASE_URL: ""
      OPENAI_CHAT_COMPLETIONS: "true"

      TRUST_PROXY: "false"

databases:
  - type: postgres
    id: main
    version: '16.14'
    bundlePlanID: standard
    planID: small-g2


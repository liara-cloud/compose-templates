apps:
  - id: "silex"
    name: "Silex"
    image: "silexlabs/silex:3.7.0"
    bundlePlanID: "standard"
    planID: "small-g2"
    disks:
      - name: storage
        mountTo: /silex/silex/storage
        size: 60
        maxSize: 6

      - name: git
        mountTo: /silex/silex/hosting
        size: 40
        maxSize: 4

    port: 6805
    envs:

      SILEX_HOST: "$APP_NAME.liara.run"
      SILEX_PORT: "6805" 
      SILEX_PROTOCOL: "https"
      SILEX_FORCE_HTTPS: "TRUE"

      SILEX_CORS_URL: "*"
 
      SILEX_EXPRESS_JSON_LIMIT: "1mb"
      SILEX_EXPRESS_TEXT_LIMIT: "10MB"
      SILEX_EXPRESS_URLENCODED_LIMIT: "1mb"
      SILEX_DEBUG: "FALSE"

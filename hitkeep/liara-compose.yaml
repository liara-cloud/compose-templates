apps:
  - id: "hermes-agent"
    name: "Hermes-Agent"
    image: "nousresearch/hermes-agent:v2026.8.3"
    bundlePlanID: "standard"
    planID: "small-g2"
    port: 8642

    disks:
      - name: data
        mountTo: /opt/data
        size: 50
        maxSize: 5
        
    args:
      - gateway
      - run
        

    envs:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: "$RANDOM_STRING"


      
